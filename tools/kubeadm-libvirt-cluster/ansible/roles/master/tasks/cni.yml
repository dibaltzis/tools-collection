---
- name: Check if Flannel namespace exists
  ansible.builtin.command:
    cmd: kubectl get namespace kube-flannel
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig_path }}"
  register: flannel_namespace_check
  failed_when: false
  changed_when: false

- name: Install Flannel CNI
  ansible.builtin.command:
    cmd: >
      kubectl apply -f {{ kubernetes_cni_manifest }}
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig_path }}"
  when: flannel_namespace_check.rc != 0