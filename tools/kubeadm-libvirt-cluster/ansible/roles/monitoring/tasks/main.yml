---
- name: Create monitoring manifests directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /tmp/monitoring
    - /tmp/monitoring/prometheus
    - /tmp/monitoring/grafana
    - /tmp/monitoring/node-exporter

# Static manifests
# ------------------------------------------------

- name: Copy static monitoring manifests
  ansible.builtin.copy:
    src: manifests/
    dest: /tmp/monitoring/
    mode: '0644'

# Rendered manifests
# ------------------------------------------------

- name: Render Prometheus deployment manifest
  ansible.builtin.template:
    src: prometheus/deployment.yml.j2
    dest: /tmp/monitoring/prometheus/deployment.yml
    mode: '0644'

- name: Render Grafana deployment manifest
  ansible.builtin.template:
    src: grafana/deployment.yml.j2
    dest: /tmp/monitoring/grafana/deployment.yml
    mode: '0644'

- name: Render node-exporter daemonset manifest
  ansible.builtin.template:
    src: node-exporter/daemonset.yml.j2
    dest: /tmp/monitoring/node-exporter/daemonset.yml
    mode: '0644'

# Apply manifests
# ------------------------------------------------

- name: Apply monitoring namespace
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/monitoring/namespace.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true

- name: Apply node-exporter manifests
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/monitoring/node-exporter/
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true

- name: Apply Prometheus manifests
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/monitoring/prometheus/
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true

- name: Apply Grafana manifests
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/monitoring/grafana/
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true