<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service Unavailable</title>

    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #111827;
            color: #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
        }

        .card {
            max-width: 600px;
            padding: 2rem;
            text-align: center;

            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 1rem;
        }

        p {
            margin: 0;
            line-height: 1.6;
            color: #d1d5db;
        }

        .code {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.35rem 0.75rem;

            border-radius: 6px;
            background: #374151;

            font-family: monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="code">502 / 503 / 504</div>

    <h1>Service Unavailable</h1>

    <p>
        The requested backend service is currently unavailable.
        Please try again later.
    </p>
</div>

<script>
    setTimeout(() => {
        window.location.reload();
    }, 60000);
</script>

</body>
</html>
